<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Corravale Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-container {
        max-width: 1100px;
        margin: 100px auto 40px;
        padding: 0 24px;
      }
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .admin-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      }
      .leads-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        margin-top: 16px;
      }
      .leads-table th, .leads-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .leads-table th {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.85rem;
        text-transform: uppercase;
        color: var(--text-muted, #888);
      }
      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .status-new { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
      .status-read { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
      .status-archived { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
      .action-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
      }
      .action-btn:hover { background: var(--line); }
      #loginOverlay {
        position: fixed;
        inset: 0;
        background: rgba(7, 20, 38, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .login-box {
        background: var(--surface);
        border: 1px solid var(--line);
        padding: 32px;
        border-radius: 16px;
        width: 100%;
        max-width: 360px;
      }
    </style>
  </head>
  <body>
    <!-- Simple Passcode Modal -->
    <div id="loginOverlay">
      <div class="login-box">
        <h3 style="margin-bottom: 16px;">Admin Access</h3>
        <input 
          type="password" 
          id="passkeyInput" 
          placeholder="Enter Passkey" 
          style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); margin-bottom: 16px;"
        />
        <button id="loginBtn" class="btn primary" style="width: 100%;">Access Dashboard</button>
      </div>
    </div>

    <main class="admin-container">
      <div class="admin-header">
        <div>
          <h2>Leads Dashboard</h2>
          <p style="color: #888; font-size: 0.9rem;">Corravale Digital incoming client briefs</p>
        </div>
        <button id="refreshBtn" class="btn secondary">↻ Refresh Leads</button>
      </div>

      <div class="admin-card">
        <div style="overflow-x: auto;">
          <table class="leads-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Client Email</th>
                <th>Message / Brief</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody">
              <tr>
                <td colspan="5" style="text-align: center; color: #888;">Loading leads...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
  </body>
</html>
